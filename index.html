<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Budget</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* Reset de base */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout : tableau de bord une colonne façon app — carte « reste après charges », grille de 4 indicateurs, liste de charges à cocher, répartition en anneau ; barre d'onglets fixe en bas. */
:root{
  --bg:#F6F5F3; --card:#FFFFFF; --soft:#F1F0EE; --line:#E8E6E3; --ink:#242322; --muted:#7D7A76;
  --rose:#D46F93; --rose-ink:#FFFFFF; --rose-soft:#FBE6EE; --lav:#9C8FD9; --ok:#5FA48A; --ok-soft:#E3F2EC; --blue:#4A7FC1; --blue-soft:#E2ECF8; --warn:#D9774F;
  --t1:#D46F93; --t2:#9C8FD9; --t3:#E9A788; --t4:#7FB6A3; --t5:#E3B9CB; --t6:#B8AFC0;
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", sans-serif;
  --serif:ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --shadow:0 1px 2px rgba(30,28,26,.04), 0 8px 24px -16px rgba(30,28,26,.14);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131312; --card:#1C1C1B; --soft:#262524; --line:#302F2D; --ink:#EEEDEB; --muted:#A3A09B;
  --rose:#EE9DB9; --rose-ink:#2A1720; --rose-soft:#3A2430; --lav:#B7ACEE; --ok:#86CDB0; --ok-soft:#1E3129; --blue:#8DB6EA; --blue-soft:#1C2A3B; --warn:#F0A07E;
  --t1:#EE9DB9; --t2:#B7ACEE; --t3:#F2BDA3; --t4:#93CDB9; --t5:#C98BA6; --t6:#8F8698;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131312; --card:#1C1C1B; --soft:#262524; --line:#302F2D; --ink:#EEEDEB; --muted:#A3A09B;
  --rose:#EE9DB9; --rose-ink:#2A1720; --rose-soft:#3A2430; --lav:#B7ACEE; --ok:#86CDB0; --ok-soft:#1E3129; --blue:#8DB6EA; --blue-soft:#1C2A3B; --warn:#F0A07E;
  --t1:#EE9DB9; --t2:#B7ACEE; --t3:#F2BDA3; --t4:#93CDB9; --t5:#C98BA6; --t6:#8F8698;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:18px}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:0 2px}
.hello{font-size:13px;color:var(--muted);font-weight:500}
.brand{font-family:var(--serif);font-size:32px;line-height:1;letter-spacing:-.01em}
.brand em{color:var(--rose)}
.sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;padding-bottom:4px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ok)} .sync.bad i{background:var(--warn)}

.seg{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:18px}
.seg button:active{background:var(--soft)}
.seg .label{font-weight:600;font-size:15px;text-transform:capitalize;text-align:center}
.seg .label small{display:block;font-weight:500;font-size:11px;color:var(--muted);text-transform:none}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 16px 0}
.card-h h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.005em}
.card-h .aside{font-size:12.5px;color:var(--muted);font-weight:500}
.card-b{padding:14px 16px 16px}

.hero{padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--card)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.big{font-family:var(--serif);font-size:clamp(48px,14vw,62px);line-height:.95;letter-spacing:-.02em}
.big .c{font-size:.5em;color:var(--muted)}
.big.neg{color:var(--warn)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600}
.chip:active{background:var(--soft)}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--soft);gap:2px}
.stack span{height:100%}
.hero-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:500}
.hero-meta b{color:var(--ink);font-weight:600}
.cta{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--rose);color:var(--rose-ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-size:11.5px;color:var(--muted)}
.kpis.k3{grid-template-columns:repeat(3,1fr);gap:8px}
.k3 .kpi{padding:12px 10px;gap:4px;border-radius:16px}
.k3 .kpi{padding:11px 8px 11px 10px}
.k3 .kpi .k{font-size:10.5px;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.k3 .kpi .k .dot{width:6px;height:6px}
@media (max-width:380px){.k3 .kpi .k .dot{display:none}}
.k3 .kpi .v{font-size:17px}
.k3 .kpi .sub{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opts{display:flex;flex-direction:column;gap:8px}
.opts label{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer}
.opts label:has(input:checked){border-color:var(--rose);background:var(--rose-soft)}
.opts input{accent-color:var(--rose);width:18px;height:18px;margin:0;flex:none}
.opts span{display:flex;flex-direction:column}
.opts small{color:var(--muted);font-size:12px}
.start-hint{grid-column:1/-1;margin:-2px 0 0;font-size:11px;color:var(--muted)}
.edit input[type=month]{-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;min-height:40px;height:40px;line-height:20px;overflow:hidden}
.edit input[type=month]::-webkit-date-and-time-value{text-align:left;margin:0}
.edit input[type=month]::-webkit-datetime-edit{padding:0}
.edit label{overflow:hidden}
.hist{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 10px}
.hist i{font-style:normal;opacity:.6}
.hist .next{color:var(--rose);font-weight:600}
.hist-x{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;text-decoration:underline;padding:2px}
.hist-x.armed{color:var(--warn)}
.hero-meta .tr-line{flex-basis:100%;order:3;color:var(--t3);font-weight:600}
.hero-add{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--blue);font-size:18px;font-weight:600;line-height:1;display:grid;place-items:center;padding:0}
.hero-add:active{background:var(--blue-soft)}
.hero-meta .tr-line.extra{order:2;border:0;background:transparent;padding:0;text-align:left;color:var(--blue);font:inherit;font-weight:600;cursor:pointer}
.field2 label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-align:center;margin-bottom:2px}
.amount-field.small input{font-size:36px}
.amount-field.small span{font-size:22px}
.k3 .kpi .sub.sal-sub{flex-wrap:wrap;row-gap:2px;white-space:normal}
.k3 .kpi .sub.lines{display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.k3 .kpi .sub.lines span{overflow:hidden;text-overflow:ellipsis}
.kpi .sub .tr.apl{color:var(--t4)}
.hero-meta .tr-line.apl{color:var(--t4);order:2}
.kpi .sub .tr{font-size:11px;font-weight:600;color:var(--t3)}
.k3 .kpi .sub{display:flex;align-items:center;gap:5px}
button.kpi{position:relative}
.sal-edit.corner{position:absolute;top:8px;right:8px}
.sal-edit{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--rose-soft);color:var(--rose)}
.sal-edit svg{width:12px;height:12px}
.backup{display:grid;grid-template-columns:1fr auto;gap:8px}
button.kpi{text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer}
button.kpi:active{background:var(--soft)}
.sav-ic{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;color:var(--card);font-weight:700;font-size:13px}
.amt.zero{color:var(--rose);font-size:13px;background:var(--rose-soft);padding:6px 10px;margin-right:0;border-radius:999px}

.progress{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.progress span{display:block;height:100%;border-radius:99px;background:var(--rose);transition:width .3s}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px}
.row + .row{border-top:1px solid var(--line)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tick{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);flex:none;display:grid;place-items:center;padding:0;transition:.15s}
.tick svg{width:14px;height:14px;opacity:0;color:var(--rose-ink)}
.paid .tick{background:var(--rose);border-color:var(--rose)}
.paid .tick svg{opacity:1}
.paid .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rose)}
.amt{border:0;background:transparent;font-weight:600;padding:6px 8px;margin-right:-8px;border-radius:8px;white-space:nowrap}
.amt:active{background:var(--soft)}
.amt.edited{color:var(--lav)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tags{display:flex;gap:6px;flex:none}
.tag.rose{background:var(--rose-soft);color:var(--rose)}

.donut{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.donut svg{width:132px;height:132px;display:block}
.legend{display:flex;flex-direction:column;gap:8px;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .p{color:var(--muted);font-size:12px}
@media (max-width:360px){.donut{grid-template-columns:1fr;justify-items:center}}

.chart svg{width:100%;height:auto;display:block}
.chart-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:8px}
.chart-legend span{display:flex;align-items:center;gap:6px}
.hbar{display:flex;flex-direction:column;gap:6px;padding:10px 16px}
.hbar + .hbar{border-top:1px solid var(--line)}
.hbar .top{display:flex;align-items:center;gap:8px;font-size:13.5px}
.hbar .top .n{flex:1;font-weight:500}
.hbar .top .f{color:var(--muted);font-size:12.5px}
.hbar .top .f b{color:var(--ink);font-weight:600}

details.cat{border-top:1px solid var(--line)}
details.cat summary{list-style:none;cursor:pointer}
details.cat summary::-webkit-details-marker{display:none}
details.cat .chev{color:var(--muted);transition:transform .2s;font-size:16px}
details.cat[open] .chev{transform:rotate(90deg)}
details.cat .det{padding:0 16px 10px 32px;display:flex;flex-direction:column;gap:6px}
details.cat .det div{display:flex;gap:8px;font-size:13px}
details.cat .det .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.cat .det .m{color:var(--muted);font-size:12px}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:14px}
.empty b{color:var(--ink);display:block;margin-bottom:4px;font-weight:600}
.note{background:var(--rose-soft);border-radius:14px;padding:12px 14px;font-size:13.5px}
.note.warn{background:var(--soft);border:1px solid var(--warn)}

.edit{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.edit + .edit{border-top:1px solid var(--line)}
.edit .full{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.edit input,.edit select{width:100%;min-width:0;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 10px;font-size:16px}
.edit label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:600;min-width:0}
.del{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:18px}
.del.armed{background:var(--warn);color:#fff;border-color:var(--warn);font-size:12px;width:auto;padding:0 10px}
.add{border:1.5px dashed var(--line);background:transparent;border-radius:16px;padding:13px;font-weight:600;color:var(--rose);width:100%}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;font-size:14px}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--rose-soft);color:var(--rose);font-size:12px;font-weight:700;display:grid;place-items:center}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
nav.tabs .in{display:flex;gap:4px;max-width:540px;width:100%}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;padding:7px 0;border-radius:12px}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--rose)}

.backdrop{position:fixed;inset:0;background:rgba(40,20,30,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:24px 24px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet .in{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-size:17px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet h3 button{border:0;background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.sheet p.hint{margin:-6px 0 0;font-size:13px;color:var(--muted)}
.amount-field{display:flex;align-items:baseline;justify-content:center;gap:6px;border-bottom:1.5px solid var(--line);padding-bottom:4px}
.amount-field:focus-within{border-color:var(--rose)}
.amount-field input{border:0;background:transparent;font-family:var(--serif);font-size:52px;width:100%;text-align:center;outline:none;min-width:0}
.amount-field .sign{flex:none;align-self:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:20px;font-weight:600}
.amount-field span{font-family:var(--serif);font-size:30px;color:var(--muted)}
.primary{border:0;border-radius:14px;background:var(--rose);color:var(--rose-ink);padding:15px;font-weight:600;font-size:16px;width:100%}
.secondary{border:1px solid var(--line);border-radius:14px;background:transparent;padding:13px;font-weight:600;width:100%;color:var(--muted)}
.err{color:var(--warn);font-size:13px;font-weight:600;min-height:1em;margin:0;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:500;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">Mon <em>Budget</em></div>
  </header>
  <main id="main" class="wrap" style="padding:0"></main>
</div>

<nav class="tabs" aria-label="Navigation"><div class="in">
  <a href="#mois" data-tab="mois"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Ce mois</a>
  <a href="#annee" data-tab="annee"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20v-7M10 20V7M15 20v-10M20 20V4"/></svg>Année</a>
  <a href="#charges" data-tab="charges"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Mes charges</a>
</div></nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importInput" accept=".json,application/json" hidden>

<script>
(function(){
const $=s=>document.querySelector(s);
const eur=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const eur0=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const pad=n=>String(n).padStart(2,'0');
const key=(y,m)=>y+'-'+pad(m+1);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uidGen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const parseAmt=v=>{const n=parseFloat(String(v).replace(/[\s €]/g,'').replace(',','.'));return isFinite(n)?Math.round(n*100)/100:NaN};
const clone=o=>JSON.parse(JSON.stringify(o));
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const TYPES=[['logement','Logement'],['energie','Énergie & eau'],['abos','Abonnements'],['assur','Assurances'],['transport','Transport'],['autre','Autre']];
const typeName=t=>(TYPES.find(x=>x[0]===t)||TYPES[5])[1];
const typeColor=t=>{const i=TYPES.findIndex(x=>x[0]===t);return `var(--t${(i<0?5:i)+1})`};

const DEFAULTS={fixed:[]};
const DEFAULT_SAV=[];
const EXTRA_TYPES=[['credit','Déblocage de crédit','de crédit'],['cadeau','Cadeau','de cadeau'],['autre','Autre','']];
const customTypes=()=>(store.settings&&Array.isArray(store.settings.extraTypes))?store.settings.extraTypes:[];
const extraLabel=e=>{if(e.label)return esc(e.label);const t=EXTRA_TYPES.find(x=>x[0]===e.type);if(t&&t[2])return t[2];const c=customTypes().find(x=>x.id===e.type);return c?esc(c.name):'autre revenu'};
const KINDS={
  depense:{title:'Mes dépenses',one:'catégorie',ex:'Courses, sorties, shopping…',add:'+ Ajouter une catégorie',newTitle:'Nouvelle catégorie de dépense',q:'Quoi ?',ph:'Ex. Courses',done:'Dépensé',ask:'dépensé',empty:'Aucune catégorie de dépense.'},
  epargne:{title:'Mon épargne',one:'compte épargne',ex:'Livret A, LDDS, LEP…',add:'+ Ajouter un compte épargne',newTitle:'Nouveau compte épargne',q:'Où ?',ph:'Ex. Livret A',done:'Versé',ask:'mis de côté',empty:'Aucun compte épargne.'},
  invest:{title:'Mes investissements',one:'investissement',ex:'PEA, crypto, assurance-vie…',add:'+ Ajouter un investissement',newTitle:'Nouvel investissement',q:'Où ?',ph:'Ex. PEA',done:'Investi',ask:'investi',empty:'Aucun investissement.'}};
const accKind=id=>{const a=settings().savings.find(x=>x.id===id);return a&&KINDS[a.kind]?a.kind:'epargne'};
const savColor=i=>`var(--t${[2,4,3,1,5,6][i%6]})`;

const now=new Date(), CUR=key(now.getFullYear(),now.getMonth());
const TABS=['mois','annee','charges'];
let view={tab:TABS.includes(location.hash.slice(1))?location.hash.slice(1):'mois',month:CUR,year:now.getFullYear()};
let store={}, editingSettings=false;
const MAXM=(()=>{const t=new Date(now.getFullYear(),now.getMonth()+1,1);return key(t.getFullYear(),t.getMonth())})(); // mois suivant = limite
const MAXY=+MAXM.slice(0,4);
const MINM='2026-01', MINY=2026; // début du calendrier

const settings=()=>{const s=store.settings&&Array.isArray(store.settings.fixed)?store.settings:DEFAULTS;return Array.isArray(s.savings)?s:{...s,savings:DEFAULT_SAV}};
const monthDoc=k=>{const d=store['m-'+k]?clone(store['m-'+k]):{};d.salary=d.salary??null;d.tr=d.tr??null;d.apl=d.apl??null;d.extras=Array.isArray(d.extras)?d.extras:[];d.paid=d.paid||{};d.amounts=d.amounts||{};d.savings=d.savings||{};return d};
const savName=id=>{const a=settings().savings.find(x=>x.id===id);return a?a.name:'Ancien placement'};
const savCol=id=>{const i=settings().savings.findIndex(x=>x.id===id);return i<0?'var(--t6)':savColor(i)};
const ym=k=>{const [y,m]=k.split('-').map(Number);return {y,m:m-1}};
const shift=(k,d)=>{const {y,m}=ym(k);const t=new Date(y,m+d,1);return key(t.getFullYear(),t.getMonth())};
const dayLbl=d=>d===1?'1er':String(d);

/* Montant d'une charge pour un mois donné : montant de base, remplacé par chaque changement daté (history) dont le mois d'effet est atteint. */
function amountFor(f,k){let a=f.amount;(f.history||[]).slice().sort((x,y)=>x.from.localeCompare(y.from)).forEach(h=>{if(h.from<=k)a=h.amount});return a}
const fmtMonth=k=>{const {y,m}=ym(k);return MOIS[m]+' '+y};
function calc(k){
  const md=monthDoc(k), list=settings().fixed.filter(f=>!f.start||k>=f.start);
  const items=list.map(f=>{const base=amountFor(f,k),paid=md.paid[f.id]!=null;const amount=paid?md.paid[f.id]:(md.amounts[f.id]??base);return {...f,base,type:f.type||'autre',amount,paid,edited:!paid&&md.amounts[f.id]!=null&&md.amounts[f.id]!==base||paid&&md.paid[f.id]!==base}});
  const total=items.reduce((a,x)=>a+x.amount,0), paid=items.filter(x=>x.paid).reduce((a,x)=>a+x.amount,0);
  const extra=md.extras.reduce((a,e)=>a+(+e.amount||0),0);let saved=0,invested=0,spent=0;Object.entries(md.savings).forEach(([id,v])=>{v=+v||0;const kd=accKind(id);kd==='invest'?invested+=v:kd==='depense'?spent+=v:saved+=v});
  return {md,items,total,paid,saved,invested,spent,extra,toPay:total-paid,salary:md.salary,tr:md.tr,apl:md.apl,rest:md.salary!=null||md.apl!=null||extra?(md.salary||0)+(md.apl||0)+extra-total-spent-saved-invested:null,nPaid:items.filter(x=>x.paid).length};
}
function byType(items){const o={};items.forEach(x=>o[x.type]=(o[x.type]||0)+x.amount);return TYPES.map(([id,n])=>({id,n,v:o[id]||0,col:typeColor(id)})).filter(x=>x.v>0)}

/* ---------- sauvegarde ---------- */
/* Données stockées uniquement sur l'appareil (localStorage du navigateur), jamais envoyées ailleurs. */
const LS_KEY='monbudget-data-v1';
function save(id,data,silent){
  store[id]=data; if(!silent) render();
  try{localStorage.setItem(LS_KEY,JSON.stringify(store))}
  catch(e){toast("Impossible d'enregistrer sur cet appareil (navigation privée ?).")}
}
const saveMonth=(k,md,silent)=>save('m-'+k,{salary:md.salary,tr:md.tr,apl:md.apl,extras:md.extras,paid:md.paid,amounts:md.amounts,savings:md.savings},silent);
function saveSettings(s,silent){save('settings',{fixed:s.fixed,savings:s.savings,extraTypes:s.extraTypes||[]},silent)}

/* ---------- rendu ---------- */
function render(force){
  document.querySelectorAll('nav.tabs a').forEach(a=>{a.dataset.tab===view.tab?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
  if(view.tab==='charges'&&!force&&editingSettings) return;
  $('#main').innerHTML=view.tab==='mois'?renderMonth():view.tab==='annee'?renderYear():renderCharges();
  editingSettings=view.tab==='charges';
}
function statusNote(){return ''}
function money(v){const s=eur.format(v);const i=s.lastIndexOf(',');return i<0?s:`${s.slice(0,i)}<span class="c">${s.slice(i)}</span>`}
function donut(parts,total,center,sub){
  const R=52,C=2*Math.PI*R;let off=0,arcs='';
  parts.forEach(p=>{const len=total?p.v/total*C:0;arcs+=`<circle r="${R}" cx="66" cy="66" fill="none" stroke="${p.col}" stroke-width="14" stroke-dasharray="${Math.max(0,len-2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)" stroke-linecap="butt"/>`;off+=len});
  return `<svg viewBox="0 0 132 132" role="img" aria-label="Répartition des charges"><circle r="${R}" cx="66" cy="66" fill="none" stroke="var(--soft)" stroke-width="14"/>${arcs}<text x="66" y="66" text-anchor="middle" font-family="ui-serif, New York, Georgia, serif" font-size="24" fill="var(--ink)">${center}</text><text x="66" y="84" text-anchor="middle" font-size="10.5" fill="var(--muted)">${sub}</text></svg>`;
}

function accCard(kind,c){
  const K=KINDS[kind],all=settings().savings,list=all.filter(a=>(a.kind||'epargne')===kind);
  const tot=kind==='invest'?c.invested:kind==='depense'?c.spent:c.saved;
  return `<section class="card"><div class="card-h"><h2>${K.title}</h2><span class="aside num">${eur0.format(tot)} ce mois-ci</span></div>
    <div class="rows" style="padding-top:6px">${list.map(s=>{const i=all.indexOf(s),v=+c.md.savings[s.id]||0;return `<div class="row"><span class="sav-ic" style="background:${savColor(i)}">${esc(s.name.slice(0,1).toUpperCase())}</span><div class="main"><span class="t">${esc(s.name)}</span><span class="s">${v?K.done+' ce mois-ci':'Rien pour l\'instant'}</span></div><button class="amt num ${v?'':'zero'}" data-act="saving" data-id="${s.id}" aria-label="Montant pour ${esc(s.name)}">${v?eur.format(v):'+ Montant'}</button></div>`}).join('')||`<div class="empty" style="padding:14px 16px">${K.empty} Ajoute-en dans « Mes charges ».</div>`}</div></section>`;
}
function renderMonth(){
  const k=view.month,{y,m}=ym(k),c=calc(k),isCur=k===CUR;
  const prevSal=monthDoc(shift(k,-1)).salary, parts=byType(c.items);
  let hero;
  {
    const sal=Math.max(c.salary||0,c.total+c.spent+c.saved+c.invested)||1;
    hero=`<section class="card hero"><div class="hero-top"><span class="eyebrow">Reste à vivre</span><button class="hero-add" data-act="extra" aria-label="Ajouter un revenu ponctuel">+</button></div>
      <div class="big num ${c.rest<0?'neg':''}">${c.rest==null?'— €':money(c.rest)}</div>
      <div class="stack" aria-hidden="true">${parts.map(p=>`<span style="width:${p.v/sal*100}%;background:${p.col}"></span>`).join('')}${c.spent>0?`<span style="width:${c.spent/sal*100}%;background:var(--t5)"></span>`:''}${c.saved?`<span style="width:${c.saved/sal*100}%;background:repeating-linear-gradient(135deg,var(--lav) 0 4px,var(--rose-soft) 4px 7px)"></span>`:''}${c.invested?`<span style="width:${c.invested/sal*100}%;background:repeating-linear-gradient(135deg,var(--t4) 0 4px,var(--rose-soft) 4px 7px)"></span>`:''}</div>
      <div class="hero-meta num"><span>${c.rest==null?'Ajoute ton salaire pour le calculer':'Après charges, dépenses, épargne et investissements'}</span>${c.apl?`<span class="tr-line apl">dont ${eur0.format(c.apl)} d'APL</span>`:''}${c.md.extras.map(e=>`<button type="button" class="tr-line extra num" data-act="extra" data-id="${e.id}">+ ${eur0.format(e.amount)} ${extraLabel(e)}</button>`).join('')}${c.tr?`<span class="tr-line">+ ${eur0.format(c.tr)} de tickets resto</span>`:''}<span>${isCur?'Mois en cours':k<CUR?'Mois terminé':'Mois à venir'}</span></div></section>`;
  }
  const pct=c.items.length?c.nPaid/c.items.length*100:0;
  const rows=c.items.length?`<div class="rows">${[...c.items].sort((a,b)=>a.paid-b.paid||a.day-b.day).map(x=>`<div class="row ${x.paid?'paid':''}">
      <button class="tick" data-act="toggle" data-id="${x.id}" aria-pressed="${x.paid}" aria-label="${x.paid?'Marquer non payé':'Marquer payé'} : ${esc(x.name)}">${CHECK}</button>
      <div class="main"><span class="t">${esc(x.name)}</span><span class="s"><span class="dot" style="background:${typeColor(x.type)}"></span>${x.paid?'Payé':'Le '+dayLbl(x.day)} · ${typeName(x.type)}</span></div>
      <button class="amt num ${x.edited?'edited':''}" data-act="amount" data-id="${x.id}" aria-label="Modifier le montant de ${esc(x.name)} ce mois-ci">${eur.format(x.amount)}</button></div>`).join('')}</div>`
    :`<div class="empty"><b>Aucune charge</b>Ajoute ton loyer et tes abonnements dans « Mes charges ».</div>`;
  return `${statusNote()}
  <div class="seg"><button data-act="mprev" aria-label="Mois précédent" ${k<=MINM?'disabled style="opacity:.25;cursor:default"':''}>‹</button><div class="label">${MOIS[m]} ${y}</div><button data-act="mnext" aria-label="Mois suivant" ${k>=MAXM?'disabled style="opacity:.25;cursor:default"':''}>›</button></div>
  ${hero}
  <div class="kpis k3">
    <div class="card kpi"><span class="k"><span class="dot" style="background:var(--rose)"></span>Charges du mois</span><span class="v num">${eur0.format(c.total)}</span><span class="sub">${c.items.length} prélèvements</span></div>
    <div class="card kpi"><span class="k"><span class="dot" style="background:var(--ok)"></span>Déjà payé</span><span class="v num">${eur0.format(c.paid)}</span><span class="sub">${c.nPaid} sur ${c.items.length}</span></div>
    <div class="card kpi"><span class="k"><span class="dot" style="background:var(--t5)"></span>Reste à payer</span><span class="v num">${eur0.format(c.toPay)}</span><span class="sub">${c.toPay?'d\'ici la fin du mois':'tout est réglé'}</span></div>
    <button class="card kpi" data-act="salary"><span class="sal-edit corner" aria-label="Modifier le salaire"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg></span><span class="k"><span class="dot" style="background:var(--t3)"></span>Salaire</span><span class="v num">${c.salary!=null?eur0.format(c.salary):'—'}</span><span class="sub sal-sub">${c.apl?`<span class="tr apl num">+ ${eur0.format(c.apl)} APL</span>`:''}${c.tr?`<span class="tr num">+ ${eur0.format(c.tr)} TR</span>`:''}</span></button>
    <div class="card kpi"><span class="k"><span class="dot" style="background:var(--lav)"></span>Épargne</span><span class="v num">${eur0.format(c.saved)}</span><span class="sub">${c.salary?Math.round(c.saved/c.salary*100)+' % du salaire':'ce mois-ci'}</span></div>
    <div class="card kpi"><span class="k"><span class="dot" style="background:var(--t4)"></span>Investissement</span><span class="v num">${eur0.format(c.invested)}</span><span class="sub">${c.salary?Math.round(c.invested/c.salary*100)+' % du salaire':'ce mois-ci'}</span></div>
  </div>
  <section class="card"><div class="card-h"><h2>Charges du mois</h2>${c.items.length&&c.nPaid===c.items.length?'<span class="tag ok">Tout est payé</span>':`<span class="aside num">${c.nPaid}/${c.items.length} payées</span>`}</div>
    <div class="card-b" style="padding-bottom:4px"><div class="progress"><span style="width:${pct}%"></span></div></div>${rows}</section>
  ${accCard('depense',c)}
  ${accCard('epargne',c)}
  ${accCard('invest',c)}
  ${parts.length?`<section class="card"><div class="card-h"><h2>Répartition</h2><span class="aside">par type</span></div><div class="card-b donut">${donut(parts,c.total,eur0.format(c.total),'par mois')}
    <div class="legend">${parts.map(p=>`<div><span class="dot" style="background:${p.col}"></span><span class="n">${p.n}</span><span class="num">${eur0.format(p.v)}</span><span class="p num">${Math.round(p.v/c.total*100)} %</span></div>`).join('')}</div></div></section>`:''}`;
}

function renderYear(){
  const y=view.year;
  const months=[...Array(12)].map((_,i)=>{const k=key(y,i),c=calc(k);return {i,k,c,has:!!store['m-'+k]&&(c.salary!=null||c.tr!=null||c.apl!=null||c.nPaid>0||c.saved>0||c.invested>0||c.spent>0||c.extra!==0)}});
  const tracked=months.filter(x=>x.has);
  const paid=tracked.reduce((a,x)=>a+x.c.paid,0), income=tracked.reduce((a,x)=>a+(x.c.salary||0)+(x.c.apl||0)+(x.c.tr||0),0), aplY=tracked.reduce((a,x)=>a+(x.c.apl||0),0), trY=tracked.reduce((a,x)=>a+(x.c.tr||0),0);
  const spentY=tracked.reduce((a,x)=>a+x.c.spent,0), savedY=tracked.reduce((a,x)=>a+x.c.saved,0), investY=tracked.reduce((a,x)=>a+x.c.invested,0);
  const so={};tracked.forEach(x=>Object.entries(x.c.md.savings).forEach(([id,v])=>{if(+v)so[id]=(so[id]||0)+(+v)}));
  const accParts=kind=>Object.keys(so).filter(id=>accKind(id)===kind).map(id=>({id,n:savName(id),v:so[id],col:savCol(id)})).sort((a,b)=>b.v-a.v);
  const accSection=(kind,title,tot,sub)=>{const ps=accParts(kind);return ps.length?`<section class="card"><div class="card-h"><h2>${title}</h2><span class="aside">sur ${y}</span></div>
    <div class="card-b donut">${donut(ps,tot,eur0.format(tot),sub)}<div class="legend">${ps.map(p=>`<div><span class="dot" style="background:${p.col}"></span><span class="n">${esc(p.n)}</span><span class="num">${eur0.format(p.v)}</span></div>`).join('')}</div></div></section>`:''};
  const perCharge={};tracked.forEach(x=>x.c.items.filter(i=>i.paid).forEach(i=>{const p=perCharge[i.id]||(perCharge[i.id]={name:i.name,type:i.type,v:0,n:0});p.v+=i.amount;p.n++}));
  const W=340,H=170,top=14,bot=24,slot=(W-12)/12,bw=slot*.5;
  const max=Math.max(1,...months.map(x=>Math.max(x.has?x.c.paid:0,x.c.salary||0,x.has?x.c.saved:0,x.has?x.c.invested:0)));
  const p10=Math.pow(10,Math.floor(Math.log10(max))), nice=Math.ceil(max/p10*2)/2*p10;
  const sy=v=>top+(H-top-bot)*(1-v/nice);
  let g=[nice,nice/2].map(v=>`<line x1="0" x2="${W}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${W}" y="${sy(v)-4}" text-anchor="end" font-size="10" fill="var(--muted)">${eur0.format(v)}</text>`).join('')+`<line x1="0" x2="${W}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--line)"/>`;
  months.forEach(x=>{const cx=6+slot*x.i+slot/2,isC=x.k===CUR;
    if(x.has&&x.c.paid>0) g+=`<rect x="${cx-bw/2}" y="${sy(x.c.paid)}" width="${bw}" height="${Math.max(2,sy(0)-sy(x.c.paid))}" rx="${bw/2>6?6:bw/2}" fill="var(--rose)" opacity="${isC?1:.7}"/>`;
    if(x.c.salary!=null) g+=`<line x1="${cx-slot*.4}" x2="${cx+slot*.4}" y1="${sy(x.c.salary)}" y2="${sy(x.c.salary)}" stroke="var(--t3)" stroke-width="2.5" stroke-linecap="round"/>`;
    g+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" font-weight="${isC?700:500}" fill="${isC?'var(--ink)':'var(--muted)'}">${MOIS[x.i][0].toUpperCase()}</text>`});
  // courbes épargne et investissement (mois suivis uniquement)
  [['saved','var(--lav)'],['invested','var(--t4)']].forEach(([f,col])=>{
    const pts=months.filter(x=>x.has).map(x=>[6+slot*x.i+slot/2,sy(x.c[f])]);
    if(!pts.length||!months.some(x=>x.has&&x.c[f]>0))return;
    if(pts.length>1) g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="var(--card)" stroke="${col}" stroke-width="2"/>`});
  });
  const o={};tracked.forEach(x=>x.c.items.filter(i=>i.paid).forEach(i=>o[i.type]=(o[i.type]||0)+i.amount));
  const parts=TYPES.map(([id,n])=>({id,n,v:o[id]||0,col:typeColor(id)})).filter(p=>p.v>0).sort((a,b)=>b.v-a.v);
  const pmax=Math.max(1,...parts.map(p=>p.v));
  const list=tracked.length?`<div class="rows">${[...tracked].reverse().map(x=>{const r=x.c.salary!=null||x.c.apl!=null||x.c.tr!=null||x.c.extra?(x.c.salary||0)+(x.c.apl||0)+(x.c.tr||0)+x.c.extra-x.c.paid-x.c.spent-x.c.saved-x.c.invested:null;const inc=x.c.salary!=null||x.c.apl!=null||x.c.tr!=null?(x.c.salary||0)+(x.c.apl||0)+(x.c.tr||0):null;return `<button class="row" style="border-left:0;border-right:0;border-bottom:0;background:transparent;text-align:left;width:100%" data-act="gomonth" data-k="${x.k}"><div class="main"><span class="t" style="text-transform:capitalize">${MOIS[x.i]}</span><span class="s num">Charges payées ${eur0.format(x.c.paid)} · ${x.c.nPaid}/${x.c.items.length}</span></div><span class="tags">${inc!=null?`<span class="tag blue num" title="Revenus">${eur0.format(inc)}</span>`:''}${r!=null?`<span class="tag ${r>=0?'ok':'rose'} num" title="Solde">${r>=0?'+':''}${eur0.format(r)}</span>`:''}</span></button>`}).join('')}</div>`
    :`<div class="empty"><b>Rien pour ${y}</b>Les totaux apparaîtront dès que tu cocheras une charge.</div>`;
  return `${statusNote()}
  <div class="seg"><button data-act="yprev" aria-label="Année précédente" ${y<=MINY?'disabled style="opacity:.25;cursor:default"':''}>‹</button><div class="label">${y}<small>Suivi de l'année</small></div><button data-act="ynext" aria-label="Année suivante" ${y>=MAXY?'disabled style="opacity:.25;cursor:default"':''}>›</button></div>
  <section class="card hero"><span class="eyebrow">Charges payées en ${y}</span><div class="big num">${money(paid)}</div>

  <div class="kpis k3">

/* ---------- export / import ---------- */
async function exportData(){
  const payload={app:'mon-budget',version:1,exportedAt:new Date().toISOString(),data:store};
  const name=`mon-budget-${new Date().toISOString().slice(0,10)}.json`;
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const mark=()=>{try{localStorage.setItem(LS_KEY+':export',payload.exportedAt)}catch(e){}render(true)};
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});mark();toast('Sauvegarde exportée');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);mark();toast('Sauvegarde téléchargée');
}
let pendingImport=null;
function importFile(file){
  const r=new FileReader();
  r.onload=()=>{
    try{const p=JSON.parse(r.result);if(!p||p.app!=='mon-budget'||typeof p.data!=='object')throw 0;
      pendingImport=p.data;
      const nMonths=Object.keys(p.data).filter(k=>k.startsWith('m-')).length;
      openSheet(`<div><h3>Importer cette sauvegarde ?<button type="button" data-act="close">Annuler</button></h3></div>
        <p class="hint" style="margin:0">Sauvegarde du ${new Date(p.exportedAt).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})} · ${nMonths} mois. Elle remplacera les données actuelles de ce téléphone.</p>
        <button class="primary" type="button" data-act="confirmimport">Remplacer mes données</button>`);
    }catch(e){toast("Ce fichier n'est pas une sauvegarde Mon Budget.")}
  };
  r.readAsText(file);
}

/* ---------- événements ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='mprev'){if(view.month>MINM){view.month=shift(view.month,-1);render()}}
  else if(a==='mnext'){if(view.month<MAXM){view.month=shift(view.month,1);render()}}
  else if(a==='yprev'){if(view.year>MINY){view.year--;render()}}
  else if(a==='ynext'){if(view.year<MAXY){view.year++;render()}}
  else if(a==='gomonth'){view.month=b.dataset.k;location.hash='mois'}
  else if(a==='salary')salarySheet();
  else if(a==='copysal'){const md=monthDoc(view.month);md.salary=monthDoc(shift(view.month,-1)).salary;saveMonth(view.month,md);toast('Salaire repris')}
  else if(a==='toggle'){const md=monthDoc(view.month),x=calc(view.month).items.find(i=>i.id===b.dataset.id);
    if(md.paid[x.id]!=null){delete md.paid[x.id];md.amounts[x.id]=x.amount;if(x.amount===x.base)delete md.amounts[x.id]}
    else md.paid[x.id]=x.amount; saveMonth(view.month,md)}
  else if(a==='amount')amountSheet(b.dataset.id);
  else if(a==='saving')savingSheet(b.dataset.id);
  else if(a==='extra')extraSheet(b.dataset.id||null);
  else if(a==='delextra'){const id=$('#extraForm').dataset.id,md=monthDoc(view.month);md.extras=md.extras.filter(x=>x.id!==id);saveMonth(view.month,md);closeSheet();toast('Revenu supprimé')}
  else if(a==='sign'){const i=$('#sav-v'),v=i.value.trim();i.value=v.startsWith('-')?v.slice(1):'-'+v;i.focus()}
  else if(a==='export')exportData();
  else if(a==='import')$('#importInput').click();
  else if(a==='confirmimport'){if(pendingImport){store=pendingImport;pendingImport=null;
    try{localStorage.setItem(LS_KEY,JSON.stringify(store))}catch(e){toast("Impossible d'enregistrer sur cet appareil.");return}
    closeSheet();render(true);toast('Données importées')}}
  else if(a==='prefill'){$('#sal-v').value=b.dataset.s.replace('.',',');$('#tr-v').value=b.dataset.t.replace('.',',');$('#apl-v').value=b.dataset.a.replace('.',',');b.remove()}
  else if(a==='clearhist'){
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Confirmer';setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent='Effacer'}},3000);return}
    const s=clone(settings()),it=s.fixed[+b.dataset.i];it.amount=amountFor(it,CUR);delete it.history;saveSettings(s,true);render(true);toast('Historique effacé')}
  else if(a==='newacc')newAccSheet(b.dataset.kind);
  else if(a==='clearsav'){const id=$('#savForm').dataset.id,md=monthDoc(view.month);delete md.savings[id];saveMonth(view.month,md);closeSheet()}
  else if(a==='delacc'){
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Supprimer';setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent='×'}},3000);return}
    const s=clone(settings());s.savings.splice(+b.dataset.i,1);saveSettings(s,true);render(true);toast('Compte retiré (les montants passés restent dans le suivi)')}
  else if(a==='resetamt'){const id=$('#amtForm').dataset.id,md=monthDoc(view.month),f=settings().fixed.find(f=>f.id===id);delete md.amounts[id];if(md.paid[id]!=null)md.paid[id]=amountFor(f,view.month);saveMonth(view.month,md);closeSheet()}
  else if(a==='close')closeSheet();
  else if(a==='add'){const s=clone(settings());s.fixed.push({id:'f'+uidGen(),name:'Nouvelle charge',amount:0,day:1,type:'autre',start:CUR});saveSettings(s,true);render(true);
    const last=document.querySelectorAll('#main .edit input[data-set="name"]');const el=last[last.length-1];el&&(el.focus(),el.select())}
  else if(a==='del'){
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Supprimer';setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent='×'}},3000);return}
    const s=clone(settings());s.fixed.splice(+b.dataset.i,1);saveSettings(s,true);render(true);toast('Charge supprimée')}
});

document.addEventListener('change',ev=>{

  if(ev.target.name==='eff'){$('#pickWrap').hidden=ev.target.value!=='pick';return}
  const t=ev.target.closest('[data-set]');if(!t)return;
  const s=clone(settings()),i=+t.dataset.i,f=t.dataset.set,item=s.fixed[i]||{};
  if(f==='name'){const v=t.value.trim();if(!v){t.value=item.name;return}item.name=v}
  else if(f==='amount'){const cur=amountFor(item,CUR),v=parseAmt(t.value);t.value=String(cur).replace('.',',');
    if(isNaN(v)||v<0){toast('Indique un montant, par ex. 650');return}
    if(v!==cur)effSheet(i,v);return}
  else if(f==='day'){const v=parseInt(t.value,10);if(!(v>=1&&v<=31)){t.value=item.day;toast('Choisis un jour entre 1 et 31');return}item.day=v}
  else if(f==='type')item.type=t.value;
  else if(f==='start'){const v=t.value;if(v&&!/^\d{4}-\d{2}$/.test(v)){t.value=item.start||'';toast('Choisis un mois');return}
    if(v)item.start=v;else delete item.start;saveSettings(s,true);render(true);toast(v?`Comptée à partir de ${fmtMonth(v)}`:'Comptée depuis toujours');return}
  else if(f==='acc-name'){const v=t.value.trim();if(!v){t.value=s.savings[i].name;return}s.savings[i].name=v;saveSettings(s,true);toast('Enregistré');return}
  const wasEx=!!settings().example;saveSettings(s,true);toast('Enregistré');
  if(wasEx){const n=$('#main .note:not(.warn)');n&&n.remove()}
  const tot=$('#main .card-h .aside');tot&&(tot.textContent=eur0.format(s.fixed.reduce((a,x)=>a+x.amount,0))+' / mois');
});

document.addEventListener('submit',ev=>{
  ev.preventDefault();const f=ev.target;
  if(f.id==='salForm'){const sv=$('#sal-v').value.trim(),tv=$('#tr-v').value.trim(),av=$('#apl-v').value.trim(),v=sv?parseAmt(sv):null,t=tv?parseAmt(tv):null,ap=av?parseAmt(av):null;
    if([v,t,ap].some(x=>x!==null&&(isNaN(x)||x<0))){$('#sal-err').textContent='Indique un montant, par exemple 2100 ou 2 100,50.';return}
    const md=monthDoc(view.month);md.salary=v;md.tr=t||null;md.apl=ap||null;saveMonth(view.month,md);closeSheet();toast('Revenus enregistrés')}
  if(f.id==='effForm'){const choice=(f.querySelector('input[name=eff]:checked')||{}).value,i=+f.dataset.i,v=+f.dataset.v;
    let from=choice==='cur'?CUR:choice==='next'?shift(CUR,1):choice==='pick'?$('#eff-month').value:null;
    if(choice==='pick'&&!/^\d{4}-\d{2}$/.test(from||'')){$('#eff-err').textContent='Choisis un mois (format AAAA-MM).';return}
    if(from&&(from<MINM||from>MAXM)){$('#eff-err').textContent=`Choisis un mois entre ${fmtMonth(MINM)} et ${fmtMonth(MAXM)}.`;return}
    const s=clone(settings()),item=s.fixed[i];
    if(choice==='always'){item.amount=v;delete item.history}
    else{item.history=(item.history||[]).filter(h=>h.from!==from);item.history.push({from,amount:v})}
    saveSettings(s,true);closeSheet();render(true);toast(choice==='always'?'Prix modifié':`${eur.format(v)} dès ${fmtMonth(from)}`);return}
  if(f.id==='extraForm'){const v=parseAmt($('#x-v').value);let type=(f.querySelector('input[name=xt]:checked')||{}).value||'credit';
    if(isNaN(v)||v<=0){$('#x-err').textContent='Indique un montant, par exemple 2000.';return}
    if(type==='autre'){const name=$('#x-new').value.trim();if(!name){$('#x-err').textContent='Indique le nom du revenu.';return}
      const st=clone(settings()),list=st.extraTypes=Array.isArray(st.extraTypes)?st.extraTypes:[];
      let c=list.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!c){c={id:'x'+uidGen(),name};list.push(c);saveSettings(st,true)}
      type=c.id}
    const md=monthDoc(view.month),id=f.dataset.id||uidGen(),entry={id,type,amount:v};
    const i=md.extras.findIndex(x=>x.id===id);i>=0?md.extras[i]=entry:md.extras.push(entry);
    saveMonth(view.month,md);closeSheet();toast(`+ ${eur.format(v)} ajouté au reste à vivre`);return}
  if(f.id==='savForm'){const v=parseAmt($('#sav-v').value||'0');if(isNaN(v)){$('#sav-err').textContent='Indique un montant, par exemple 150 ou -300.';return}
    const id=f.dataset.id,md=monthDoc(view.month);if(v)md.savings[id]=v;else delete md.savings[id];saveMonth(view.month,md);closeSheet();toast(v?`${eur.format(v)} sur ${savName(id)}`:'Remis à 0')}
  if(f.id==='accForm'){const name=$('#acc-name').value.trim(),v=parseAmt($('#acc-v').value||'0');
    if(!name){$('#acc-err').textContent=`Indique un nom (${KINDS[f.dataset.kind].ph}).`;return}
    if(isNaN(v)||v<0){$('#acc-err').textContent='Indique un montant valide.';return}
    const s=clone(settings()),id='a'+uidGen();s.savings.push({id,name,kind:f.dataset.kind});saveSettings(s,true);
    if(v){const md=monthDoc(view.month);md.savings[id]=v;saveMonth(view.month,md,true)}
    closeSheet();render(true);toast(`${name} ajouté`)}
  if(f.id==='amtForm'){const v=parseAmt($('#amt-v').value);if(isNaN(v)||v<0){$('#amt-err').textContent='Indique un montant valide.';return}
    const id=f.dataset.id,md=monthDoc(view.month);if(md.paid[id]!=null)md.paid[id]=v;else md.amounts[id]=v;saveMonth(view.month,md);closeSheet();toast('Montant mis à jour pour ce mois')}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.includes(h)){view.tab=h;render(true);window.scrollTo(0,0)}});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}

/* ---------- démarrage ---------- */
function init(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);if(d&&typeof d==='object')store=d}}catch(e){}
  render(true);
  $('#importInput').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)importFile(f);e.target.value=''});
  // demande au navigateur de ne pas effacer le stockage de l'app
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  // cache hors connexion
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();
})();
</script>
